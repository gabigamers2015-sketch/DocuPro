workflows:
  android-workflow:
    name: DocuPro Android Build
    max_build_duration: 60
    environment:
      node: 20
      groups:
        - keystore_creds
      vars:
        PACKAGE_NAME: "com.gabigamers2015sketch.docupro"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild Android project
        script: npx expo prebuild --platform android
      - name: Set up signing
        script: |
          echo $CM_KEYSTORE | base64 -d > android/app/keystore.jks
          echo "MYAPP_UPLOAD_STORE_FILE=keystore.jks" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$CM_KEY_ALIAS_PASSWORD" >> android/gradle.properties
      - name: Configure signing in build.gradle
        script: python3 scripts/patch_gradle.py
      - name: Build Android AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
