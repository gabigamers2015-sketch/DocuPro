workflows:
  android-workflow:
    name: DocuPro Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      vars:
        PACKAGE_NAME: "com.gabigamers2015sketch.docupro"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild Android project
        script: npx expo prebuild --platform android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
